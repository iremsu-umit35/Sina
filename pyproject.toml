[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sina"
version = "0.1.0"
description = "Python kodundan pytest testleri üretmeye yönelik geliştirici aracı"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=2.23,<3",
    "python-dotenv>=1.2.3,<2",
    "streamlit>=1.65,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
